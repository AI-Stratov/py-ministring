name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install . pytest
      - name: Test
        # -X dev turns on the debug memory allocator, which fills fresh
        # memory with 0xCD, so reads of uninitialized fields crash loudly.
        run: python -X dev -m pytest -v

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install with sanitizers
        env:
          CFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -g
          LDFLAGS: -fsanitize=address,undefined
        run: python -m pip install -v . pytest
      - name: Test
        # The interpreter itself is not instrumented, so the ASan runtime has
        # to be preloaded. PYTHONMALLOC=malloc routes every allocation through
        # ASan instead of pymalloc; leak checking is off because CPython does
        # not free everything at exit.
        run: |
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so)"
          python -m pytest -v
        env:
          PYTHONMALLOC: malloc
          ASAN_OPTIONS: detect_leaks=0
